<!DOCTYPE html>
<!-- Copyright (c) 2026 Marina Bay's Cafe. All rights reserved. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d3a4e">
<title>Menu | Marina Bay's Cafe</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
  :root { --harbor: #0d3a4e; --brass: #b08a57; --ink: #14262e; --muted: #52646c; --line: #d3dcd9; --soft: #f1f4f2; --serif: "Palatino Linotype", Palatino, "Book Antiqua", "Iowan Old Style", Georgia, serif; color-scheme: light; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 118px; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
  .top { background: var(--harbor); color: #fff; display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
  .top img { width: 40px; height: 40px; border-radius: 8px; }
  .top b { display: block; font-family: var(--serif); font-size: 20px; line-height: 1.15; }
  .top span { color: #d8c49d; font-style: italic; font-family: var(--serif); font-size: 14px; }
  .chip-table { display: inline-block; margin: 12px 16px 0; padding: 6px 14px; border-radius: 99px; background: var(--brass); color: #1b1408; font-weight: 700; }
  .notice { margin: 12px 16px 0; padding: 10px 12px; border-left: 4px solid var(--brass); background: var(--soft); border-radius: 4px; }
  nav { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; -webkit-overflow-scrolling: touch; }
  nav a { flex: 0 0 auto; min-height: 44px; display: inline-flex; align-items: center; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 99px; color: var(--harbor); font-weight: 600; text-decoration: none; white-space: nowrap; }
  nav a:focus-visible, .search input:focus-visible, button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .search { padding: 10px 16px 0; }
  .search input { width: 100%; min-height: 44px; font: inherit; padding: 0 12px; border: 1.5px solid #9aa9a8; border-radius: 8px; }
  main { padding: 4px 0 24px; }
  h2.grp { margin: 22px 16px 0; font-family: var(--serif); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  section { padding: 0 16px; }
  section h3 { margin: 18px 0 2px; font-family: var(--serif); font-size: 22px; color: var(--harbor); }
  section .tag { margin: 0 0 6px; color: var(--muted); font-style: italic; }
  .item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item.out { opacity: .72; }
  .item .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; font-weight: 700; }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); color: var(--harbor); }
  .badge.best { background: #f3e8d2; border-color: var(--brass); color: #5b4318; }
  .badge.sold { background: #fbeceb; border-color: #c9524a; color: #8a1f17; }
  .desc { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .prices { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .prices li { display: flex; gap: 8px; }
  .prices .l { color: var(--muted); }
  .prices .p { font-weight: 700; font-variant-numeric: tabular-nums; }
  .addons { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  .addons b { color: var(--ink); }
  #status { margin: 28px 16px; text-align: center; color: var(--muted); }
  #status button { margin-top: 10px; min-height: 44px; padding: 0 18px; font: inherit; font-weight: 700; border: 0; border-radius: 8px; background: var(--harbor); color: #fff; }
  footer { padding: 16px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
  @media (min-width: 720px) { main, .notice, nav, .search, footer { max-width: 760px; margin-left: auto; margin-right: auto; } .chip-table { margin-left: max(16px, calc(50% - 364px)); } }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
<script src="firebase-config.js"></script>
<script src="menu-snapshot.js"></script>
</head>
<body>
<header class="top"><img src="icons/logo-64.png" alt="" width="40" height="40"><div><b id="cafeName">Marina Bay's Cafe</b><span>Menu</span></div></header>
<div id="tableChip" class="chip-table" hidden></div>
<p id="notice" class="notice" hidden></p>
<nav id="chips" aria-label="Menu sections" hidden></nav>
<div class="search" id="searchBox" hidden><input id="q" type="search" placeholder="Search the menu" aria-label="Search the menu" autocomplete="off"></div>
<main id="main"><p id="status" role="status">Loading the menu...</p></main>
<footer id="foot" hidden></footer>
<script>
(function () {
  'use strict';
  var CK = 'mb_public_menu_v1', cfg = window.MB_FIREBASE_CONFIG || {}, SN = window.MBMenuSnap, state = { snap: null, t: '', fromCache: false, q: '' };
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function anchor(id) { return 'c-' + String(id).toLowerCase().replace(/[^a-z0-9]+/g, '-'); }
  function status(msg, retry) {
    var s = $('status'); if (!s) { s = el('p'); s.id = 'status'; s.setAttribute('role', 'status'); $('main').appendChild(s); }
    s.textContent = msg; s.hidden = !msg;
    if (msg && retry) { var b = el('button', '', 'Try again'); b.type = 'button'; b.onclick = function () { status('Loading the menu...'); fetchFresh(); }; s.appendChild(document.createElement('br')); s.appendChild(b); }
  }
  function match(it, c, q) {
    if (!q) return true;
    var hay = [it.n, it.d, c.n].concat((it.o || []).map(function (o) { return o.l; })).join(' ').toLowerCase();
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) !== -1; });
  }
  function render() {
    var snap = state.snap; if (!snap) return;
    var main = $('main'), q = state.q.trim().toLowerCase(), chips = $('chips'), shown = 0;
    $('cafeName').textContent = snap.name || "Marina Bay's Cafe";
    var note = $('notice'); note.textContent = snap.note || ''; note.hidden = !snap.note;
    main.textContent = ''; chips.textContent = ''; var lastGroup = null;
    snap.cats.forEach(function (c) {
      var items = c.i.filter(function (it) { return match(it, c, q); }); if (!items.length) return;
      shown += items.length;
      if (c.g && c.g !== lastGroup) { main.appendChild(el('h2', 'grp', c.g)); } lastGroup = c.g;
      var a = el('a', '', c.n); a.href = '#' + anchor(c.id); chips.appendChild(a);
      var sec = el('section'); sec.id = anchor(c.id); sec.appendChild(el('h3', '', c.n)); if (c.t) sec.appendChild(el('p', 'tag', c.t));
      items.forEach(function (it) {
        var art = el('article', 'item' + (it.s ? ' out' : '')), nm = el('div', 'nm'); nm.appendChild(el('span', '', it.n));
        if (it.b) nm.appendChild(el('span', 'badge best', 'Best seller')); if (it.s) nm.appendChild(el('span', 'badge sold', 'Sold out'));
        art.appendChild(nm); if (it.d) art.appendChild(el('p', 'desc', it.d));
        if (it.o && it.o.length) {
          var ul = el('ul', 'prices'); it.o.forEach(function (o) { var li = el('li'); if (o.l) li.appendChild(el('span', 'l', o.l)); li.appendChild(el('span', 'p', SN.peso(o.p))); ul.appendChild(li); }); art.appendChild(ul);
        }
        sec.appendChild(art);
      });
      (snap.addons || []).forEach(function (g) {
        if (g.c.indexOf(c.id) === -1) return;
        var p = el('p', 'addons'); p.appendChild(el('b', '', g.n + ': ')); p.appendChild(document.createTextNode(g.i.map(function (a2) { return a2.n + ' +' + SN.peso(a2.p); }).join(', '))); sec.appendChild(p);
      });
      main.appendChild(sec);
    });
    chips.hidden = !chips.childNodes.length; $('searchBox').hidden = false;
    if (!shown) { var s = el('p'); s.id = 'status'; s.setAttribute('role', 'status'); s.textContent = q ? 'Nothing matches your search.' : 'The menu is empty right now.'; main.appendChild(s); }
    var foot = $('foot'), d = state.t ? new Date(state.t) : null, when = d && !isNaN(d) ? d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
    foot.textContent = 'Prices are in Philippine pesos.' + (when ? ' Menu updated ' + when + '.' : '') + (state.fromCache ? ' Showing the menu saved on this phone.' : ''); foot.hidden = false;
  }
  function fetchFresh() {
    if (!cfg.projectId) { if (!state.snap) status('This menu is not set up yet.'); return; }
    var url = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(cfg.projectId) + '/databases/(default)/documents/public_menu/current' + (cfg.apiKey ? '?key=' + encodeURIComponent(cfg.apiKey) : '');
    var ctl = ('AbortController' in window) ? new AbortController() : null, to = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
    fetch(url, ctl ? { signal: ctl.signal } : undefined).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }).then(function (j) {
      clearTimeout(to); var p = SN.parseRest(j); if (!p) throw new Error('bad menu');
      state.snap = p.snap; state.t = p.t; state.fromCache = false; try { localStorage.setItem(CK, JSON.stringify({ snap: p.snap, t: p.t })); } catch (e) {}
      status(''); render();
    }).catch(function () {
      clearTimeout(to);
      if (state.snap) { state.fromCache = true; render(); } else status('We could not load the menu. Please check your connection and try again.', true);
    });
  }
  var tb = SN.tableLabel(new URLSearchParams(location.search).get('table')); if (tb) { var tc = $('tableChip'); tc.textContent = 'Table ' + tb; tc.hidden = false; }
  $('q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  try { var c = JSON.parse(localStorage.getItem(CK)); if (c && c.snap && c.snap.v === SN.VERSION && Array.isArray(c.snap.cats)) { state.snap = c.snap; state.t = c.t || ''; state.fromCache = true; status(''); render(); } } catch (e) {}
  fetchFresh();
})();
</script>
</body>
</html>
